<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" width="100%" height="100%">
  <defs>
    <filter id="shadow-ubp" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.15" />
    </filter>
  </defs>
  <!-- Geometric Logo: UBP diamond/cubes -->
  <g transform="translate(15, 12)" filter="url(#shadow-ubp)">
    <polygon points="28,4 52,28 28,52 4,28" fill="#DC2626" />
    <polygon points="28,14 42,28 28,42 14,28" fill="#1E3A8A" />
    <polygon points="28,21 35,28 28,35 21,28" fill="#FFFFFF" />
  </g>
  <!-- Text Brand -->
  <text x="82" y="37" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#0F172A" letter-spacing="-0.5">UBP</text>
  <text x="82" y="52" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="8.5" fill="#DC2626" letter-spacing="1">BLAS PASCAL</text>
</svg>
